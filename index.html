<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <script>
      ;(() => {
        let theme
        try {
          theme = localStorage.getItem('portfolio-theme')
        } catch {}
        if (theme !== 'light' && theme !== 'dark')
          theme = matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#f8fafc' : '#0f172a'
      })()
    </script>
    <meta
      name="description"
      content="Javie Alfaro is a Software Developer and Data Analyst studying Computer Science at Holy Angel University, expected to graduate in 2027."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Javie Alfaro — Software Developer &amp; Data Analyst"
    />
    <meta
      property="og:description"
      content="Software development, data analysis, and cloud. Computer Science student at Holy Angel University."
    />
    <meta property="og:locale" content="en_US" />
    <link rel="canonical" href="https://javiealfaro.vercel.app/" />
    <meta property="og:url" content="https://javiealfaro.vercel.app/" />
    <meta
      property="og:image"
      content="https://javiealfaro.vercel.app/social-preview.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Desktop view of Javie Alfaro’s developer portfolio"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Javie Alfaro — Software Developer &amp; Data Analyst</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >This portfolio needs JavaScript to display. Please enable JavaScript in
      your browser.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
